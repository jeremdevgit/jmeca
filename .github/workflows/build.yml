name: CI and desktop builds
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jmeca-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    name: Dependency security
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: npm ci
      - run: npm audit
      - run: cargo install cargo-audit --locked
      - run: cargo audit --file src-tauri/Cargo.lock
  desktop:
    name: ${{ matrix.artifact }} build and tests
    needs: security
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundle: app
            artifact: macos
          - os: windows-latest
            bundle: nsis
            artifact: windows
          - os: ubuntu-24.04
            bundle: deb
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check
      - name: Browser tests
        if: runner.os == 'Linux'
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Build Windows or Linux installer
        if: runner.os != 'macOS'
        run: npm run desktop:build -- --bundles ${{ matrix.bundle }}
      - name: Install Intel Rust target for universal macOS build
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin
      - name: Build universal macOS application
        if: runner.os == 'macOS'
        run: npm run desktop:build -- --target universal-apple-darwin --bundles app
      - name: Package macOS installers
        if: runner.os == 'macOS'
        run: zsh scripts/package_macos.sh
      - name: Checksum Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer missing' }
          $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText('SHA256SUMS-windows.txt', "$hash  $($installer.Name)`n", [Text.UTF8Encoding]::new($false))
      - name: Checksum Linux installer
        if: runner.os == 'Linux'
        run: cd src-tauri/target/release/bundle/deb && sha256sum *.deb > SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'macOS'
        with:
          name: JMeca-${{ matrix.artifact }}
          path: dist/installers/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Windows'
        with:
          name: JMeca-${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Linux'
        with:
          name: JMeca-${{ matrix.artifact }}
          path: src-tauri/target/release/bundle/deb/*
