[package]
name = "jmeca"
version = "0.1.1"
description = "Garage personnel et carnet d'entretien chiffré"
authors = ["jeremdevgit"]
edition = "2021"
license = "GPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rfd = "0.17"
tempfile = "3"
base64 = "0.22"
tauri-plugin-single-instance = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = "s"
